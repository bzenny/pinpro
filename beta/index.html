<html lang="en">

<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1c1f1d;--muted:#6b716c;--line:#e3e6e1;--brand:#2563eb;--brand-soft:#e8effd;--good:#15803d;--warn:#b45309;--bad:#b91c1c;--c1:#2563eb;--c2:#f2a93b;--c3:#e8615a;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--brand);color:#fff}

.mark{width:28px;height:28px;flex-shrink:0;color:#fff}
.setup .hero-img{width:200px;height:200px;display:block;margin:0 auto -6px}
.setup .mark{width:44px;height:44px;color:var(--ink);vertical-align:middle;margin-right:6px}
.setup h1{display:flex;align-items:center;justify-content:center}
#app{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:2px 0 8px}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
h2{font-size:20px;margin:0 0 10px} h3{font-size:16px;margin:16px 4px 8px} .card h3{margin:0 0 8px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.mini{padding:10px 12px}
.mini b{display:block;font-size:20px;font-variant-numeric:tabular-nums;margin-top:4px}
.totals .mini b{font-size:16px}

.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{color:var(--bad)}

.actions .btn span{font-size:22px}
.status{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:600}
.status.good{background:#e8f5ec;color:var(--good)} .status.warn{background:#fdf3e4;color:var(--warn)} .status.bad{background:#fdecec;color:var(--bad)}
.goodtxt{color:var(--good)} .badtxt{color:var(--bad)} .warntxt{color:var(--warn)}
.hint{margin:8px 0 0;font-size:14px;color:var(--muted)}

.name{font-weight:700} .sub{font-size:13px;color:var(--muted)}

.sheet-card h2{padding-right:40px}
.close{position:absolute;top:8px;right:8px}

.f{display:block;margin-bottom:12px} .f span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}

.ledger li.muted{padding:14px}
.amt.utang{color:var(--bad)} .amt.bayad,.amt.in{color:var(--good)}
.plain li{padding:4px 0}
.back{border:0;background:none;font:inherit;font-weight:700;color:var(--brand);padding:6px 0 10px;cursor:pointer}
.catbar{margin:8px 0} .catbar .row-between{font-size:14px}

.empty{text-align:center;color:var(--muted);padding:28px 10px}

.ask-card p{margin:0 0 14px;font-size:16px;line-height:1.45}
a{color:var(--brand)}
.langs{display:flex;gap:6px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
.langs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;min-height:40px}
.langs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sheet-card .langs{justify-content:flex-start;margin:6px 0 14px}
.contact{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.contact a{word-break:break-all}
a.btn{text-decoration:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.beta{flex-shrink:0;font-size:10px;letter-spacing:.06em;background:#f2a93b;color:#3b2500;padding:3px 6px;border-radius:6px}

</head>

let lang = 'en';
function t(key, v) {
  const row = STR[key]; let s = row ? (row[LI[lang]] ?? row[0]) : key;
  return v ? s.replace(/\{(\w+)\}/g, (_, k) => (v[k] ?? '')) : s;
}
function guessLang() {
  const l = (navigator.language || '').toLowerCase();
  return l.startsWith('ceb') ? 'ceb' : (l.startsWith('fil') || l.startsWith('tl')) ? 'tl' : 'en';
}
function langPicker() {
  return `<div class="langs" role="group" aria-label="${t('language')}">${LANGS.map(([k, n]) =>
    `<button type="button" data-act="lang" data-id="${k}" class="${lang === k ? 'on' : ''}">${n}</button>`).join('')}</div>`;
}

// ---------- Storage adapter (the only place that touches storage) ----------
// Beta testers and the official app keep SEPARATE data, even on the same phone.
const APP_VERSION = '1.4.0';
const CHANNEL = /(^|[\/.])(beta|test|staging)([\/.-]|$)/i.test(location.hostname + location.pathname) ? 'beta' : 'prod';
const KEY = CHANNEL === 'beta' ? 'pinpro.beta.v1' : 'pinpro.v1', LANG_KEY = 'pinpro.lang';
const Store = {
  load() { try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } },
  save(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch (e) { toast(t('t_cant_save')); return false; }
  },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
  size() { try { return (localStorage.getItem(KEY) || '').length; } catch (e) { return 0; } },
  getLang() { try { return localStorage.getItem(LANG_KEY); } catch (e) { return null; } },
  setLang(l) { try { localStorage.setItem(LANG_KEY, l); } catch (e) {} }
};
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ---------- Data model ----------
// items:     {id, name, cost, price, stock, low, packSize}
// customers: {id, name, phone, limit}
// ledger:    {id, customerId, type:'utang'|'bayad', amount, note, date, at, itemId?, stockDelta?, cashId?}
// cash:      {id, cat, amount, note, date, at, itemId?, stockDelta?, linkId?}
const CATS = {
  benta: 'in', bayad: 'in', dagdag: 'in',
  paninda: 'out', bills: 'out', upa: 'out', pamasahe: 'out', gastos: 'out', kinuha: 'out'
};
const catLabel = k => CATS[k] ? t('cat_' + k) : k;
const SPEND_CATS = ['bills', 'upa', 'pamasahe', 'gastos']; // counted against monthly budget

function blankData() {
  return { version: 1, store: { name: '', openingCash: 0, capital: 0, budget: 0, lastBackup: '', createdAt: today() },
           items: [], customers: [], ledger: [], cash: [] };
}
function migrate(d) {
  if (!d || typeof d !== 'object') return null;
  const b = blankData();
  const arr = k => Array.isArray(d[k]) ? d[k] : [];
  return { ...b, ...d, store: { ...b.store, ...(d.store || {}) },
           items: arr('items'), customers: arr('customers'), ledger: arr('ledger'), cash: arr('cash') };
}

let D = null; // loaded at startup (bottom of file), after all helpers exist
const state = { tab: 'home', cust: null, q: '', invFilter: 'all', period: 'month' };

// ---------- Helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function today() { return ymd(new Date()); }
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
function fmtDate(s) { return new Date(s + 'T00:00:00').toLocaleDateString('en-PH', { month: 'short', day: 'numeric' }); }
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
function peso(n) { n = r2(n); const a = Math.abs(n), d = Number.isInteger(a) ? 0 : 2; return (n < 0 ? '−' : '') + '₱' + a.toLocaleString('en-PH', { minimumFractionDigits: d, maximumFractionDigits: d }); }
const fmtQty = n => String(r2(n));
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const getItem = id => D.items.find(i => i.id === id);
const getCust = id => D.customers.find(c => c.id === id);
const byNewest = (a, b) => b.date.localeCompare(a.date) || (b.at || 0) - (a.at || 0);

let toastT;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }
function ask(msg) {
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'ask';
    el.innerHTML = `<div class="ask-card" role="alertdialog" aria-modal="true"><p>${esc(msg).replace(/\n/g, '<br>')}</p>
      <div class="grid2"><button class="btn ghost" data-r="0">${t('ask_no')}</button><button class="btn primary" data-r="1">${t('ask_yes')}</button></div></div>`;
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-r]'); if (!b && e.target !== el) return;
      e.stopPropagation(); el.remove(); res(!!b && b.dataset.r === '1');
    });
    document.body.appendChild(el); el.querySelector('[data-r="1"]').focus();
  });
}
function commit() { Store.save(D); closeSheet(); render(); }

// ---------- Derived numbers (always computed) ----------
function balanceOf(cid) { return r2(D.ledger.filter(e => e.customerId === cid).reduce((s, e) => s + (e.type === 'utang' ? e.amount : -e.amount), 0)); }
function owingSince(cid) {
  const es = D.ledger.filter(e => e.customerId === cid);
  const pays = es.filter(e => e.type === 'bayad').map(e => e.date).sort();
  if (pays.length) return { date: pays[pays.length - 1], key: 'days_pay' };
  const ut = es.filter(e => e.type === 'utang').map(e => e.date).sort();
  return ut.length ? { date: ut[0], key: 'days_first' } : null;
}
const dirOf = c => CATS[c.cat];
function cashOnHand() { return r2(D.store.openingCash + D.cash.reduce((s, c) => s + (dirOf(c) === 'in' ? c.amount : dirOf(c) === 'out' ? -c.amount : 0), 0)); }
function stockValue() { return r2(D.items.reduce((s, i) => s + Math.max(0, i.stock) * i.cost, 0)); }
function utangOut() { return r2(D.customers.reduce((s, c) => s + Math.max(0, balanceOf(c.id)), 0)); }
function totalNow() { return r2(cashOnHand() + stockValue() + utangOut()); }
function sumCash(from, to, dir) { return r2(D.cash.filter(c => c.date >= from && c.date <= to && dirOf(c) === dir).reduce((s, c) => s + c.amount, 0)); }
const isLow = i => i.low > 0 && i.stock <= i.low;
function suggestQty(i) { const pack = i.packSize || 1; const need = Math.max(i.low * 2 - i.stock, 1); return Math.ceil(need / pack) * pack; }
function sinceLine(cid) {
  const s = owingSince(cid); if (!s) return '';
  const d = daysBetween(s.date, today());
  return `<span class="${d >= 30 ? 'badtxt' : d >= 14 ? 'warntxt' : ''}">${t(s.key, { n: d })}</span>`;
}

// ---------- Rendering ----------
function render() {
  document.documentElement.lang = lang === 'tl' ? 'fil' : lang;
  const top = $('#top'), tabs = $('#tabs'), app = $('#app');
  if (!D) {
    top.innerHTML = `<div class="brand">${logo()}<span>Pin.Pro</span>${betaTag()}</div>`;
    tabs.hidden = true; app.innerHTML = viewSetup(); return;
  }
  tabs.hidden = false;
  top.innerHTML = `<div class="brand">${logo()}<span>${esc(D.store.name || 'Pin.Pro')}</span>${betaTag()}</div><button class="icon-btn" data-act="settings" aria-label="Settings">⚙️</button>`;
  tabs.innerHTML = [['home', '🏠', 'tab_home'], ['paninda', '📦', 'tab_stock'], ['listahan', '📒', 'tab_utang'], ['pera', '💰', 'tab_money']]
    .map(([id, ic, k]) => `<button data-act="tab" data-id="${id}" class="${state.tab === id ? 'on' : ''}"><span>${ic}</span>${t(k)}</button>`).join('');
  const v = { home: viewHome, paninda: viewPaninda, pera: viewPera,
              listahan: () => state.cust ? viewCustomer(state.cust) : viewListahan() }[state.tab];
  app.innerHTML = v();
}

const betaTag = () => CHANNEL === 'beta' ? '<b class="beta">BETA</b>' : '';
function viewSetup() {
  return `<div class="setup">${langPicker()}<img class="hero-img" src="${HERO_IMG}" alt="">
  <h1>${logo()}Pin.Pro</h1>
  <p class="muted">${t('setup_tagline')}</p>
  <form data-form="setup" class="card">
    ${field(t('setup_name'), 'name', '', 'text', `required placeholder="${esc(t('setup_name_ph'))}"`)}
    ${field(t('setup_cash'), 'openingCash', '')}
    <button class="btn primary">${t('start')}</button>
  </form>
  <button class="btn ghost" data-act="sample">${t('try_sample')}</button>
  <button class="btn ghost" data-act="restore">${t('have_backup')}</button></div>`;
}

// ----- Overview -----
function viewHome() {
  const cash = cashOnHand(), stock = stockValue(), ut = utangOut(), total = r2(cash + stock + ut);
  const cap = D.store.capital, td = today();
  const pos = Math.max(0, cash) + stock + ut;
  const pct = x => pos > 0 ? Math.max(0, x) / pos * 100 : 0;

  let status;
  if (!cap) {
    status = `<p class="hint">${t('set_cap_hint')}</p><button class="btn" data-act="setCapital">${t('set_cap_btn', { v: peso(total) })}</button>`;
  } else {
    const diff = r2(total - cap), ratio = diff / cap;
    const cls = diff >= 0 ? 'good' : ratio > -0.05 ? 'warn' : 'bad';
    const msg = diff >= 0 ? t('cap_ok') + (diff > 0 ? t('cap_grew', { v: peso(diff) }) : '') + '.' : t('cap_short', { v: peso(-diff) });
    status = `<div class="status ${cls}">${msg}</div>`;
  }
  const hints = [];
  if (pos > 0 && ut / pos > 0.3) hints.push(t('hint_utang', { p: Math.round(ut / pos * 100) }));
  if (cash < 0) hints.push(t('hint_neg_cash'));

  const low = D.items.filter(isLow);
  const topC = D.customers.map(c => ({ c, b: balanceOf(c.id) })).filter(x => x.b > 0).sort((a, b) => b.b - a.b).slice(0, 3);
  const needBackup = !D.store.lastBackup || daysBetween(D.store.lastBackup, td) >= 7;

  return `
  <section class="card hero">
    <div class="row-between"><span class="label">${t('cap_now')}</span>${cap ? `<span class="muted small">${t('watch', { v: peso(cap) })}</span>` : ''}</div>
    <div class="big">${peso(total)}</div>
    <div class="bar3"><i class="c1" style="width:${pct(cash)}%"></i><i class="c2" style="width:${pct(stock)}%"></i><i class="c3" style="width:${pct(ut)}%"></i></div>
    <ul class="legend">
      <li><i class="c1"></i>${t('cash_drawer')}<b>${peso(cash)}</b></li>
      <li><i class="c2"></i>${t('stock_at_cost')}<b>${peso(stock)}</b></li>
      <li><i class="c3"></i>${t('utang_owed')}<b>${peso(ut)}</b></li>
    </ul>
    ${status}${hints.map(h => `<p class="hint">💡 ${h}</p>`).join('')}
  </section>

  <div class="grid2" style="margin-bottom:12px">
    <section class="card mini" style="margin:0"><span class="label">${t('in_today')}</span><b class="goodtxt">${peso(sumCash(td, td, 'in'))}</b></section>
    <section class="card mini" style="margin:0"><span class="label">${t('out_today')}</span><b>${peso(sumCash(td, td, 'out'))}</b></section>
  </div>

  <div class="grid4 actions">
    <button class="btn" data-act="newIn"><span>🧾</span>${t('q_sale')}</button>
    <button class="btn" data-act="newOut"><span>💸</span>${t('q_expense')}</button>
    <button class="btn" data-act="newUtang"><span>📝</span>${t('q_utang')}</button>
    <button class="btn" data-act="newBayad"><span>✅</span>${t('q_payment')}</button>
  </div>

  <section class="card">
    <div class="row-between"><h3>${t('tab_stock')}</h3>${low.length ? `<span class="badge">${t('low_badge', { n: low.length })}</span>` : ''}</div>
    ${!D.items.length ? `<p class="muted">${t('no_items')}</p><button class="btn" data-act="addItem">${t('add_item_btn')}</button>`
      : low.length ? `<ul class="plain">${low.slice(0, 5).map(i => `<li>${esc(i.name)} — <b class="badtxt">${t('n_left', { n: fmtQty(i.stock) })}</b></li>`).join('')}</ul>
                      <button class="btn" data-act="tab" data-id="paninda">${t('see_buy')}</button>`

function itemRows() {

// ----- Money -----
function periodRange() {
  const td = today();
  if (state.period === 'today') return [td, td, t('lbl_today')];
  if (state.period === 'week') return [addDays(td, -6), td, t('lbl_week')];
  return [td.slice(0, 8) + '01', td, t('lbl_month')];
}
function viewPera() {
  const [from, to, label] = periodRange();
  const list = D.cash.filter(c => c.date >= from && c.date <= to).sort(byNewest);
  let tin = 0, tout = 0; const byCat = {};
  list.forEach(c => { if (dirOf(c) === 'in') tin += c.amount; else if (dirOf(c) === 'out') tout += c.amount; byCat[c.cat] = r2((byCat[c.cat] || 0) + c.amount); });
  tin = r2(tin); tout = r2(tout);
  const cats = Object.keys(byCat).filter(k => CATS[k]).sort((a, b) => byCat[b] - byCat[a]);
  const maxV = Math.max(1, ...cats.map(k => byCat[k]));

  let budgetCard = '';
  const B = D.store.budget;
  if (B && state.period === 'month') {
    const spend = r2(SPEND_CATS.reduce((s, k) => s + (byCat[k] || 0), 0));
    const now = new Date(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const pace = B * now.getDate() / dim, over = spend > B, ahead = !over && spend > pace;
    budgetCard = `<section class="card"><div class="row-between"><h3>${t('budget_title')}</h3><b>${peso(spend)} / ${peso(B)}</b></div>
      <div class="track"><div class="fill ${over ? 'over' : 'out'}" style="width:${Math.min(100, spend / B * 100)}%"></div></div>
      <p class="hint">${over ? t('b_over', { v: peso(spend - B) }) : ahead ? t('b_fast', { v: peso(pace) }) : t('b_ok', { v: peso(B - spend) })}
      <br><span class="small">${t('b_note')}</span></p></section>`;
  }

  return `
  <div class="seg wide">${[['today', 'p_today'], ['week', 'p_week'], ['month', 'p_month']].map(([k, l]) =>
    `<button data-act="period" data-id="${k}" class="${state.period === k ? 'on' : ''}">${t(l)}</button>`).join('')}</div>
  <div class="grid3 totals">
    <section class="card mini"><span class="label">${t('m_in')}</span><b class="goodtxt">${peso(tin)}</b></section>
    <section class="card mini"><span class="label">${t('m_out')}</span><b>${peso(tout)}</b></section>
    <section class="card mini"><span class="label">${t('m_left')}</span><b class="${tin - tout < 0 ? 'badtxt' : ''}">${peso(tin - tout)}</b></section>
  </div>
  <section class="card"><div class="row-between"><span class="label">${t('cash_now')}</span><b>${peso(cashOnHand())}</b></div></section>
  ${budgetCard}
  ${cats.length ? `<section class="card"><h3>${t('where')}</h3>${cats.map(k => `
    <div class="catbar"><div class="row-between"><span>${CATS[k] === 'in' ? '⬆️' : '⬇️'} ${catLabel(k)}</span><b>${peso(byCat[k])}</b></div>
    <div class="track"><div class="fill ${k === 'kinuha' ? 'kinuha' : CATS[k] === 'out' ? 'out' : ''}" style="width:${byCat[k] / maxV * 100}%"></div></div></div>`).join('')}
    ${byCat.kinuha ? `<p class="hint">${t('kinuha_hint')}</p>` : ''}
  </section>` : ''}
  <div class="grid2"><button class="btn primary" data-act="newIn">${t('btn_in')}</button><button class="btn" data-act="newOut">${t('btn_out')}</button></div>
  <h3>${t('records', { p: label })}</h3>
  <ul class="ledger">${list.length ? list.map(c => `
    <li><div><div><b>${esc(catLabel(c.cat))}</b> <span class="muted small">${fmtDate(c.date)}</span></div>${c.note ? `<div class="sub">${esc(c.note)}</div>` : ''}</div>
      <div class="amt ${dirOf(c)}">${dirOf(c) === 'in' ? '+' : '−'}${peso(c.amount)}</div>
      <button class="x" data-act="delCash" data-id="${c.id}" aria-label="${t('del')}">×</button></li>`).join('')
    : `<li class="muted">${t('no_records')}</li>`}</ul>`;
}

// ---------- Live previews inside forms ----------
const PREVIEW = {
  restock(f) {
    if (!f) return;
    const packs = num(f.packs.value), pcs = Math.max(1, num(f.pcs.value)), pc = num(f.packCost.value);
    $('#pv').textContent = t('restock_pv', { q: fmtQty(packs * pcs), pc: peso(pc / pcs), tot: peso(packs * pc) });
  },
  utang(f) {
    const i = f.itemId && getItem(f.itemId.value);
    if (i) f.amount.value = r2(i.price * (num(f.qty.value) || 1));
  }

// ---------- Form handlers ----------
const FORM = {
  setup(fd) {
    D = blankData(); D.store.name = (fd.name || '').trim(); D.store.openingCash = r2(num(fd.openingCash));
    Store.save(D); render(); toast(t('t_ready'));
  },
  async item(fd, id) {
    const name = (fd.name || '').trim(); if (!name) return toast(t('t_need_name'));
    const cost = r2(num(fd.cost)), price = r2(num(fd.price));
    if (price < cost && !(await ask(t('a_price_below')))) return;
    const low = r2(num(fd.low)), packSize = Math.max(1, Math.round(num(fd.packSize)) || 1);
    if (id) Object.assign(getItem(id), { name, cost, price, low, packSize });
    else D.items.push({ id: uid(), name, cost, price, stock: r2(num(fd.stock)), low, packSize });
    commit(); toast(t('t_saved'));
  },
  async sold(fd, id) {
    const i = getItem(id), qty = r2(num(fd.qty)), price = r2(num(fd.price));
    if (qty <= 0) return toast(t('t_need_qty'));
    if (qty > i.stock && !(await ask(t('a_qty_over', { n: fmtQty(i.stock) })))) return;
    i.stock = r2(i.stock - qty);
    D.cash.push({ id: uid(), cat: 'benta', amount: r2(qty * price), note: `${i.name} ×${fmtQty(qty)}`, date: today(), at: Date.now(), itemId: i.id, stockDelta: -qty });
    commit(); toast(t('t_plus_cash', { v: peso(qty * price) }));
  },
  restock(fd, id) {
    const i = getItem(id), packs = r2(num(fd.packs)), pcs = Math.max(1, Math.round(num(fd.pcs)) || 1), packCost = r2(num(fd.packCost));
    if (packs <= 0) return toast(t('t_need_packs'));
    const qty = r2(packs * pcs);
    i.stock = r2(i.stock + qty); i.packSize = pcs;
    if (packCost > 0) i.cost = r2(packCost / pcs);
    if (fd.fromCash === 'on' && packCost > 0)
      D.cash.push({ id: uid(), cat: 'paninda', amount: r2(packs * packCost), note: `${i.name} +${fmtQty(qty)}`, date: today(), at: Date.now(), itemId: i.id, stockDelta: qty });
    commit(); toast(`+${fmtQty(qty)} ${i.name}`);
  },
  count(fd, id) {
    const i = getItem(id), n = r2(num(fd.count)), diff = r2(n - i.stock);
    i.stock = n; commit();
    toast(diff === 0 ? t('c_ok') : diff < 0 ? t('c_short', { n: fmtQty(-diff) }) : t('c_over', { n: fmtQty(diff) }));
  },
  cust(fd, id) {
    const name = (fd.name || '').trim(); if (!name) return toast(t('t_need_name'));
    const email = (fd.email || '').trim();
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast(t('t_bad_email'));
    const data = { name, phone: (fd.phone || '').trim(), email, limit: r2(num(fd.limit)) };
    if (id) Object.assign(getCust(id), data);
    else { const c = { id: uid(), ...data }; D.customers.push(c); state.tab = 'listahan'; state.cust = c.id; }
    commit();
  },
  async utang(fd) {
    const amount = r2(num(fd.amount)); if (amount <= 0) return toast(t('t_need_amount'));
    const newName = (fd.newName || '').trim();
    if (!fd.cid && !newName) return toast(t('t_need_cust'));
    let c = fd.cid ? getCust(fd.cid) : null;
    if (c) {
      const bal = balanceOf(c.id);
      if (c.limit && bal + amount > c.limit && !(await ask(t('a_over_limit', { c: c.name, l: peso(c.limit), b: peso(bal + amount) })))) return;
    } else { c = { id: uid(), name: newName, phone: '', email: '', limit: 0 }; D.customers.push(c); }
    const e = { id: uid(), customerId: c.id, type: 'utang', amount, note: (fd.note || '').trim(), date: today(), at: Date.now() };
    if (fd.itemId) {
      const i = getItem(fd.itemId), q = r2(num(fd.qty)) || 1;
      if (i) { i.stock = r2(i.stock - q); e.itemId = i.id; e.stockDelta = -q; if (!e.note) e.note = `${i.name} ×${fmtQty(q)}`; }
    }
    D.ledger.push(e); commit(); toast(t('t_recorded', { c: c.name, v: peso(amount) }));
  },
  async bayad(fd) {
    if (!fd.cid) return toast(t('t_pick_cust'));
    const c = getCust(fd.cid), amount = r2(num(fd.amount));
    if (amount <= 0) return toast(t('t_need_amount'));
    const bal = balanceOf(c.id);
    if (amount > bal && !(await ask(t('a_overpay', { v: peso(bal) })))) return;
    const e = { id: uid(), customerId: c.id, type: 'bayad', amount, note: (fd.note || '').trim(), date: today(), at: Date.now() };
    if (fd.toCash === 'on') {
      const cash = { id: uid(), cat: 'bayad', amount, note: t('note_pay', { c: c.name }), date: e.date, at: e.at, linkId: e.id };
      e.cashId = cash.id; D.cash.push(cash);
    }
    D.ledger.push(e); commit();
    toast(bal - amount <= 0 ? t('t_paid_full', { c: c.name }) : t('t_received', { v: peso(bal - amount) }));
  },
  cash(fd) {
    const amount = r2(num(fd.amount)); if (amount <= 0) return toast(t('t_need_amount'));
    if (!CATS[fd.cat]) return;
    D.cash.push({ id: uid(), cat: fd.cat, amount, note: (fd.note || '').trim(), date: fd.date || today(), at: Date.now() });
    commit(); toast(t('t_saved'));
  },
  settings(fd) {
    Object.assign(D.store, { name: (fd.name || '').trim() || D.store.name, openingCash: r2(num(fd.openingCash)),
                             capital: r2(num(fd.capital)), budget: r2(num(fd.budget)) });
    commit(); toast(t('t_saved'));
  }
};

// ---------- Deletes (always undo side effects) ----------
function revertStock(rec) { if (rec.itemId && rec.stockDelta) { const i = getItem(rec.itemId); if (i) i.stock = r2(i.stock - rec.stockDelta); } }
async function delEntry(id) {
  const e = D.ledger.find(x => x.id === id); if (!e) return;
  const msg = t('a_del_entry', { type: t('type_' + e.type), v: peso(e.amount), d: fmtDate(e.date) }) + (e.cashId ? t('a_also_cash') : '');
  if (!(await ask(msg))) return;
  revertStock(e);
  if (e.cashId) D.cash = D.cash.filter(c => c.id !== e.cashId);
  D.ledger = D.ledger.filter(x => x.id !== id); commit();
}
async function delCash(id) {
  const c = D.cash.find(x => x.id === id); if (!c) return;
  const linked = c.linkId && D.ledger.find(e => e.id === c.linkId);
  const msg = t('a_del_cash', { c: catLabel(c.cat), v: peso(c.amount) }) + (linked ? t('a_also_ledger') : '') + (c.stockDelta ? t('a_also_stock') : '');
  if (!(await ask(msg))) return;
  revertStock(c);
  if (linked) D.ledger = D.ledger.filter(e => e.id !== c.linkId);
  D.cash = D.cash.filter(x => x.id !== id); commit();
}
async function delCust(id) {
  const c = getCust(id), bal = balanceOf(id);
  if (!(await ask(bal > 0 ? t('a_del_cust_owes', { c: c.name, v: peso(bal) }) : t('a_del_cust', { c: c.name })))) return;
  D.ledger = D.ledger.filter(e => e.customerId !== id);
  D.customers = D.customers.filter(x => x.id !== id);
  state.cust = null; commit();
}

// ---------- Sharing, backup, restore ----------
async function shareText(text) {
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast(t('t_copied')); }
  catch (e) { openSheet(`<h2>${t('copy')}</h2><textarea class="copy" readonly>${esc(text)}</textarea>`); }
}
function custMsg(id) {
  const c = getCust(id), bal = balanceOf(id);
  const recent = D.ledger.filter(e => e.customerId === id).sort(byNewest).slice(0, 5).reverse();
  const lines = recent.map(e => `${fmtDate(e.date)}  ${e.type === 'utang' ? t('e_utang').replace('📝 ', '') : t('e_bayad').replace('✅ ', '')} ${peso(e.amount)}${e.note ? ' – ' + e.note : ''}`).join('\n');
  return t('share_cust', { c: c.name, s: D.store.name, v: peso(Math.max(0, bal)), d: fmtDate(today()), lines });
}
function shareCust(id) { shareText(custMsg(id)); }
function emailLink(id) {
  const c = getCust(id);
  return `mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(t('email_subj', { s: D.store.name }))}&body=${encodeURIComponent(custMsg(id))}`;
}
function shareRestock() {
  const need = D.items.filter(isLow).map(i => ({ i, q: suggestQty(i) }));
  const est = r2(need.reduce((s, n) => s + n.q * n.i.cost, 0));
  const lines = need.map(({ i, q }) => `• ${i.name} — ${fmtQty(q)} ${t('pcs')}${(i.packSize || 1) > 1 ? ` (${fmtQty(q / i.packSize)} pack)` : ''}`).join('\n');
  shareText(t('share_restock', { s: D.store.name, d: fmtDate(today()), lines, v: peso(est) }));
}
async function doBackup() {
  const name = `pinpro-backup-${today()}.json`;
  const file = new File([JSON.stringify({ ...D, store: { ...D.store, lastBackup: today() } })], name, { type: 'application/json' });
  let ok = false;
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); ok = true; } }
  catch (e) { if (e.name === 'AbortError') return; }
  if (!ok) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  D.store.lastBackup = today(); Store.save(D); closeSheet(); render(); toast(t('t_backed'));
}

    if (!obj.store || typeof obj.store !== 'object' || Array.isArray(obj.store)) throw new Error('Missing store');
    for (const key of ['items', 'customers', 'ledger', 'cash']) {
      if (!Array.isArray(obj[key])) throw new Error('Missing ' + key + ' records');
      if (obj[key].length > 150000) throw new Error('Too many records');
      const ids = new Set();
      for (const x of obj[key]) {
        if (!x || typeof x !== 'object' || typeof x.id !== 'string' || !x.id ||
            ids.has(x.id) || !/^[a-zA-Z0-9_-]{1,96}$/.test(x.id))
          throw new Error('Invalid or duplicate ID in ' + key);
        ids.add(x.id);
      }
    }
    const finite = v => typeof v === 'number' && Number.isFinite(v);
    for (const i of obj.items) {
      if (typeof i.name !== 'string' || !finite(i.cost) || i.cost < 0 ||
          !finite(i.price) || i.price < 0 || !finite(i.stock)) throw new Error('Invalid inventory item');
    }
    for (const c of obj.customers) if (typeof c.name !== 'string') throw new Error('Invalid customer');
    const customers = new Set(obj.customers.map(x => x.id));
    const dateOK = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
    for (const e of obj.ledger) {
      if (!customers.has(e.customerId) || !['utang', 'bayad'].includes(e.type) ||
          !finite(e.amount) || e.amount <= 0 || !dateOK(e.date)) throw new Error('Invalid customer ledger');
    }
    for (const c of obj.cash) {
      if (!Object.prototype.hasOwnProperty.call(CATS, c.cat) || !finite(c.amount) || c.amount < 0 || !dateOK(c.date))
        throw new Error('Invalid cash entry');
    }
    return true;
  }

  function comparable(d) {
    const { lastBackup, lastBackupVerified, lastBackupFingerprint, ...store } = d.store || {};
    return JSON.stringify({ store, items: d.items, customers: d.customers,
      ledger: d.ledger, cash: d.cash, adjustments: d.adjustments || [] });
  }

  function fingerprint(data) {
    // Fast non-cryptographic change detector for backup freshness (not a security checksum).
    let h = 2166136261;
    for (let i = 0; i < data.length; i++) {
      h ^= data.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16) + ':' + data.length;
  }
  function backupIsCurrent() {
    return !!(D && D.store.lastBackupVerified && D.store.lastBackupFingerprint &&

  async function handleFile(e) {
    // Capture handler intentionally supersedes the old, lenient restore listener.
    e.stopImmediatePropagation();
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      if (f.size > 10 * 1024 * 1024) throw new Error('Backup is too large');
      const obj = JSON.parse(await f.text());
      validateFile(obj);
      if (pickerMode === 'verify') {
        if (!D) throw new Error('No working store available for comparison');
        if (comparable(obj) !== comparable(D))
          throw new Error('The saved file differs from current data. Make a new backup and verify it before more transactions.');
        D.store.lastBackup = today();
        D.store.lastBackupVerified = true;
        D.store.lastBackupFingerprint = fingerprint(comparable(D));
        if (commit()) notice('Backup verified. Keep the file in a safe location.');
      } else {
        if (D && !(await ask(t('a_restore')))) return;
        D = migrate(obj);
        if (!D) throw new Error('Invalid backup');
        if (!persistOrRollback()) return render();
        storageCorrupt = false;
        state.tab = 'home'; state.cust = null;
        closeSheet(); render();
        notice(t('t_restored'));
      }
    } catch (err) { notice('Backup rejected: ' + (err.message || 'Invalid JSON')); }

  doBackup = async function () {
    if (!D) return notice('Set up or restore a store before saving a backup.');
    const { name, file } = makeBackup();
    try {
      if (typeof window.showSaveFilePicker === 'function') {
        const handle = await window.showSaveFilePicker({
          suggestedName: name, types: [{ description: 'Pin.Pro backup', accept: { 'application/json': ['.json'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(file); await writable.close();
        notice('Backup saved to your chosen folder. Open Verify to confirm its contents.');
      } else {
        const url = URL.createObjectURL(file);
        const a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        notice('Download started. Find the file in Files/Downloads, then choose Verify backup.');

  ACT.unarchiveItem = id => {
    const i = getItem(id);
    if (i) {
      i.archived = false;
      if (typeof i.savedLow === 'number') { i.low = i.savedLow; delete i.savedLow; }
      if (commit()) notice('Item restored to active stock.');
    }
  };
  const oldItemSheet = sheetItem;
  sheetItem = function (id) {
    oldItemSheet(id);
    const i = getItem(id);
    if (i && i.archived) {
      const card = $('#sheet .sheet-card');
      card.insertAdjacentHTML('beforeend', '<button class="btn" data-act="unarchiveItem" data-id="' +
        esc(id) + '">Restore item to active stock</button>');
    }
  };
  ACT.item = sheetItem;
  const oldDelCash = ACT.delCash;
  ACT.delCash = async id => {
    const rec = D.cash.find(c => c.id === id);
    if (!rec) return;
    if (rec.cat === 'paninda' && rec.itemId && rec.stockDelta > 0) {
      const later = D.cash.some(c => c.itemId === rec.itemId && c.at > rec.at) ||
        D.ledger.some(e => e.itemId === rec.itemId && e.at > rec.at) ||
        (D.adjustments || []).some(a => a.itemId === rec.itemId && a.at > rec.at);
      if (later) return notice('Later stock movements exist. Use stock count and a correcting cash entry instead.');
      if (!(await ask('Undo this restock, including stock, cash and average cost?'))) return;
      const item = getItem(rec.itemId);
      if (!item || item.stock < rec.stockDelta)
        return notice('Stock has changed. Correct it using a stock count.');
      item.stock = r2(item.stock - rec.stockDelta);
      if (typeof rec.priorCost === 'number') item.cost = rec.priorCost;
      if (typeof rec.priorPackSize === 'number') item.packSize = rec.priorPackSize;
      D.cash = D.cash.filter(c => c.id !== id);
      if (commit()) notice('Restock reversed.');
      return;
    }
    return oldDelCash(id);
  };

  // Check already-stored records before the upgraded UI can render them.
  if (D) {
    try { validateFile(D); }
    catch (_) { storageCorrupt = true; D = null; savedSnapshot = null; }
  }
  // The main store data in 1.2 may have no adjustments. The field is optional for old backups.
  if (D && !Array.isArray(D.adjustments)) D.adjustments = [];
  render();
})();

</script>
