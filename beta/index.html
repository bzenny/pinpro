<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1c1f1d;--muted:#6b716c;--line:#e3e6e1;--brand:#2563eb;--brand-soft:#e8effd;--good:#15803d;--warn:#b45309;--bad:#b91c1c;--c1:#2563eb;--c2:#f2a93b;--c3:#e8615a;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}

#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--brand);color:#fff}

.mark{width:28px;height:28px;flex-shrink:0;color:#fff}

.setup h1{display:flex;align-items:center;justify-content:center}
#app{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:2px 0 8px}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
h2{font-size:20px;margin:0 0 10px} h3{font-size:16px;margin:16px 4px 8px} .card h3{margin:0 0 8px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.mini{padding:10px 12px}
.mini b{display:block;font-size:20px;font-variant-numeric:tabular-nums;margin-top:4px}
.totals .mini b{font-size:16px}
.btn{display:block;width:100%;min-height:48px;padding:10px 12px;border:0;border-radius:12px;background:var(--brand-soft);color:var(--brand);font:inherit;font-weight:700;cursor:pointer;text-align:center;margin-top:8px}
.grid2>.btn,.grid3>.btn,.grid4>.btn{margin-top:0}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{color:var(--bad)}

.actions .btn span{font-size:22px}
.status{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:600}
.status.good{background:#e8f5ec;color:var(--good)} .status.warn{background:#fdf3e4;color:var(--warn)} .status.bad{background:#fdecec;color:var(--bad)}
.goodtxt{color:var(--good)} .badtxt{color:var(--bad)} .warntxt{color:var(--warn)}
.hint{margin:8px 0 0;font-size:14px;color:var(--muted)}
.bar3{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line)} .bar3 i{display:block;height:100%}
.c1{background:var(--c1)} .c2{background:var(--c2)} .c3{background:var(--c3)}
.legend{list-style:none;padding:0;margin:10px 0 0} .legend li{display:flex;align-items:center;gap:8px;padding:4px 0}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0} .legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:transparent}
.seg{display:flex;background:#e9ebe7;border-radius:12px;padding:3px;flex-shrink:0}
.seg button{border:0;background:transparent;padding:10px 12px;border-radius:10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.wide{margin-bottom:12px} .seg.wide button{flex:1}
.row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:0;border-radius:12px;padding:12px 14px;margin-bottom:8px;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row>div:first-child{min-width:0}
.name{font-weight:700} .sub{font-size:13px;color:var(--muted)}
.qty{text-align:right;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;flex-shrink:0}
.qty small{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.qty.low{color:var(--bad)}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.amt small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:#fdecec;color:var(--bad);margin-left:6px;vertical-align:middle}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:4;border:0;border-radius:999px;background:var(--brand);color:#fff;font:inherit;font-weight:700;padding:14px 20px;box-shadow:0 4px 12px rgba(37,99,235,.35);cursor:pointer}
.pad-fab{height:70px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs[hidden]{display:none}
#tabs button{border:0;background:none;font:inherit;font-size:12px;font-weight:700;color:var(--muted);padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;cursor:pointer}
#tabs button span{font-size:22px} #tabs button.on{color:var(--brand)}
.sheet{position:fixed;inset:0;z-index:20;display:none} .sheet.show{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-card h2{padding-right:40px}
.close{position:absolute;top:8px;right:8px}
.x{border:0;background:none;font-size:22px;color:var(--muted);width:40px;height:40px;cursor:pointer;flex-shrink:0}
.f{display:block;margin-bottom:12px} .f span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.check{display:flex;align-items:center;gap:10px;margin:4px 0 14px;font-weight:600}
.check input{width:22px;height:22px;min-height:0;flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;text-align:center}
.stats b{display:block;font-size:17px} .stats span{font-size:11px;color:var(--muted)}
.ledger,.plain{list-style:none;padding:0;margin:0}
.ledger li{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:10px 4px 10px 14px;margin-bottom:6px}
.ledger li>div:first-child{flex:1;min-width:0}
.ledger li.muted{padding:14px}
.amt.utang{color:var(--bad)} .amt.bayad,.amt.in{color:var(--good)}
.plain li{padding:4px 0}
.back{border:0;background:none;font:inherit;font-weight:700;color:var(--brand);padding:6px 0 10px;cursor:pointer}
.catbar{margin:8px 0} .catbar .row-between{font-size:14px}
.track{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:4px} .fill{height:100%;background:var(--c1)}
.fill.out{background:var(--c2)} .fill.kinuha,.fill.over{background:var(--bad)}
.setup{text-align:center;padding:12px 4px 24px} .setup h1{margin:4px 0}
.setup form{text-align:left;margin-top:18px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1c1f1d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}
.btn,.row,.fab,#tabs button,.icon-btn{transition:transform .12s ease,box-shadow .18s ease,background-color .18s ease}
.btn:active,.row:active,.fab:active{transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:not-allowed}
#tabs button.on{background:linear-gradient(180deg,#eff6ff 0%,#fff 85%);box-shadow:inset 0 3px var(--brand)}
.card{box-shadow:0 3px 12px rgba(20,38,36,.045)}
.busy-overlay[hidden],.app-error[hidden]{display:none}
.busy-overlay{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(16,27,37,.42);backdrop-filter:blur(2px)}
.busy-card{width:min(90vw,300px);background:var(--card);border-radius:20px;padding:24px;display:flex;align-items:center;flex-direction:column;gap:12px;box-shadow:0 16px 48px rgba(0,0,0,.18);text-align:center}
.busy-ring{width:42px;height:42px;border:4px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:pinspin .75s linear infinite}
@keyframes pinspin{to{transform:rotate(360deg)}}
.busy-text{font-weight:700;color:var(--ink)}
.app-error{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(19,29,36,.58);backdrop-filter:blur(3px)}
.app-error-card{background:var(--card);max-width:400px;width:100%;border-radius:20px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.20)}
.app-error-icon{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:#fff4e5;color:var(--warn);border-radius:15px;font-size:26px;margin-bottom:10px}
.app-error-card h2{margin-bottom:6px}
.app-error-card p{margin:0 0 14px;color:var(--muted);line-height:1.5}
@media(prefers-reduced-motion:reduce){.busy-ring{animation-duration:1.5s}.btn,.row,.fab,#tabs button,.icon-btn{transition:none}.sheet-card{animation:none}}
textarea.copy{min-height:180px}
.icon-btn{border:0;background:rgba(255,255,255,.15);color:inherit;width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0}
.card .icon-btn{background:var(--brand-soft)}
.ask{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.ask-card{background:#fff;border-radius:16px;padding:18px;max-width:380px;width:100%}
.ask-card p{margin:0 0 14px;font-size:16px;line-height:1.45}
a{color:var(--brand)}
.langs{display:flex;gap:6px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
.langs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;min-height:40px}
.langs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sheet-card .langs{justify-content:flex-start;margin:6px 0 14px}
.contact{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.contact a{word-break:break-all}
a.btn{text-decoration:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.beta{flex-shrink:0;font-size:10px;letter-spacing:.06em;background:#f2a93b;color:#3b2500;padding:3px 6px;border-radius:6px}

/* ── Native-launch visual system: responsive, safe-area aware, no external assets ── */
:root{
  --bg:#f4f7fb;--card:#fff;--ink:#162333;--muted:#617083;--line:#e3e9f1;
  --brand:#1765d4;--brand-soft:#eaf2ff;--good:#087c53;--warn:#aa6109;--bad:#c13b41;
  --r:18px;--surface-raised:#fff;--dock-shadow:0 -6px 28px rgba(22,44,77,.09);
}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  line-height:1.45;min-height:100vh;min-height:100dvh;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
#top{
  min-height:66px;
  padding:10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  padding-top:calc(10px + env(safe-area-inset-top));
  background:linear-gradient(135deg,#1459bb 0%,#227ce2 100%);
  box-shadow:0 3px 18px rgba(25,74,133,.14);
}
.brand{font-size:19px;letter-spacing:-.35px;gap:9px}
.mark{width:30px;height:30px}
#top .icon-btn{width:46px;height:46px;min-width:46px;border-radius:15px;font-size:20px}
#app{max-width:600px;padding:20px 16px 30px}
#app>h2{font-size:25px;letter-spacing:-.65px;margin:3px 0 15px;font-weight:780}
#app>p.muted{margin-top:-5px}
.card{padding:17px;margin-bottom:13px;border:1px solid rgba(219,228,239,.5);border-radius:20px;box-shadow:0 2px 10px rgba(33,65,95,.045)}
.card.hero{padding:20px;border-radius:23px}
.hero .big{font-size:clamp(30px,7vw,42px);letter-spacing:-1.35px;line-height:1.12}
.label{font-size:11px;letter-spacing:.075em}
.card .muted,.sub{color:var(--muted)}
.row{min-height:64px;border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:9px}
.row:active{background:#f0f6ff}
.row .name{font-size:15.5px;letter-spacing:-.15px}
.row .sub{font-size:12.5px;margin-top:3px}
.qty{font-size:21px}
.grid3{gap:9px}
.grid3 .btn{font-size:13px}
.btn{min-height:50px;border-radius:14px;letter-spacing:-.12px}
.btn.primary{background:linear-gradient(180deg,#2276df 0%,#1765d4 100%);box-shadow:0 4px 9px rgba(23,101,212,.16)}
.btn.ghost{border-color:#d8e0eb}
.btn:focus-visible,.row:focus-visible,#tabs button:focus-visible{outline:3px solid #f4b544;outline-offset:3px}
button,input,select,textarea{touch-action:manipulation}
input,select,textarea{font-size:16px;border-radius:14px;min-height:50px}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(23,101,212,.20);outline-offset:1px;border-color:var(--brand)}
.f span{font-size:13px}
.f{margin-bottom:16px}
#tabs{
  background:rgba(255,255,255,.96);
  border-top:1px solid rgba(198,211,228,.6);
  box-shadow:var(--dock-shadow);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  min-height:calc(70px + env(safe-area-inset-bottom));
  padding:5px 8px env(safe-area-inset-bottom);
  gap:2px;
}
#tabs button{
  min-height:60px;border-radius:13px;margin:1px 0 2px;
  font-size:11.5px;font-weight:680;letter-spacing:-.1px;
  justify-content:center;gap:4px;
}
#tabs button span{font-size:0;display:flex;align-items:center;justify-content:center;height:25px}
#tabs button span svg{width:23px;height:23px;display:block;stroke-width:2.15}
#tabs button.on{
  color:var(--brand);background:#edf4ff;
  box-shadow:none;
}
.sheet-card{
  border-radius:24px 24px 0 0;
  box-shadow:0 -12px 50px rgba(16,38,74,.17);
  max-height:calc(100dvh - env(safe-area-inset-top) - 14px);
  overscroll-behavior:contain;
  padding:23px 18px calc(26px + env(safe-area-inset-bottom));
}
.sheet-card:before{
  content:"";display:block;width:38px;height:5px;border-radius:99px;
  background:#d4dce7;margin:-13px auto 20px;
}
.sheet-card h2{font-size:23px;line-height:1.18;letter-spacing:-.6px;font-weight:780}
.sheet-bg{background:rgba(12,28,47,.50)}
.sheet-card .x{min-height:44px;min-width:44px;border-radius:13px}
.fab{
  right:16px;bottom:calc(89px + env(safe-area-inset-bottom));
  border-radius:17px;min-height:55px;padding:15px 19px;
  box-shadow:0 8px 24px rgba(23,101,212,.28);
}
.seg{border:1px solid #e5eaf1;background:#edf1f7}
.seg button{min-height:44px}
.stats{gap:5px}
.stats b{font-size:16px}
.stats span{font-size:10px}
.badge{border-radius:7px;padding:3px 7px}
.beta{border-radius:7px;letter-spacing:.08em}
.busy-card,.app-error-card{border:1px solid rgba(255,255,255,.35)}
@media(max-width:360px){
  #app{padding:14px 11px 23px}
  .card{padding:13px}
  .grid3{gap:5px}
  .actions .btn{font-size:11px}
  .sheet-card{padding-left:14px;padding-right:14px}
}
@media(min-width:700px){
  body{padding-bottom:28px;padding-left:93px}
  #top{position:sticky;padding-right:24px;padding-left:24px}
  #app{max-width:790px;margin:0 auto;padding:30px 25px 48px}
  #tabs{
    left:0;right:auto;top:0;bottom:0;width:92px;
    grid-template-columns:1fr;grid-template-rows:repeat(4,82px);
    justify-content:center;align-content:center;
    padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px);
    border-top:0;border-right:1px solid var(--line);box-shadow:5px 0 22px rgba(31,57,91,.08);
    min-height:0;
  }
  #tabs button{min-height:76px;font-size:12px}
  .fab{right:clamp(26px,8vw,180px);bottom:36px}
  .sheet-card{left:93px;right:0;bottom:0;max-width:620px;padding:27px 28px 32px}
  .sheet-card h2{font-size:25px}
  .grid3 .btn{font-size:15px}
  .stats b{font-size:19px}
}
@media(min-width:1040px){
  #app{max-width:890px}
  .card{padding:20px}
  .sheet-card{max-width:660px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}


/* Fluid information architecture: stacked on phone, spacious on tablet,
   and a balanced work surface on laptop and desktop checkout counters. */
.overview-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.overview-main,.overview-side{min-width:0}
#app.page-paninda #list,#app.page-listahan:not(.page-detail) #list{
  display:grid;grid-template-columns:minmax(0,1fr);gap:0;align-content:start
}
#app.page-paninda #list .row,#app.page-listahan #list .row{min-width:0}
@media(min-width:880px){
  #app{max-width:960px}
  .overview-layout{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px}
  .overview-main>.card,.overview-side>.card{margin-bottom:16px}
  .overview-main>.grid4{margin-bottom:16px}
}
@media(min-width:1100px){
  #app{max-width:1150px}
  #app.page-paninda #list,#app.page-listahan:not(.page-detail) #list{
    grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:0
  }
  .overview-layout{grid-template-columns:minmax(0,1.16fr) minmax(0,.84fr);gap:24px}
  .overview-main .card.hero{padding:24px}
  .page-pera>.grid3,.page-pera>.grid2{max-width:780px}
}
@media(min-width:1400px){
  #app{max-width:1270px}
  .overview-layout{gap:30px}
}

.shortcut-bar{display:none;flex-wrap:wrap;gap:9px 16px;color:var(--muted);font-size:12px;margin:10px 0 14px;padding:10px 12px;background:#edf3fc;border-radius:12px}

let lang = 'en';
function t(key, v) {
  const row = STR[key]; let s = row ? (row[LI[lang]] ?? row[0]) : key;
  return v ? s.replace(/\{(\w+)\}/g, (_, k) => (v[k] ?? '')) : s;
}
function guessLang() {
  const l = (navigator.language || '').toLowerCase();
  return l.startsWith('ceb') ? 'ceb' : (l.startsWith('fil') || l.startsWith('tl')) ? 'tl' : 'en';
}
function langPicker() {
  return `<div class="langs" role="group" aria-label="${t('language')}">${LANGS.map(([k, n]) =>
    `<button type="button" data-act="lang" data-id="${k}" class="${lang === k ? 'on' : ''}">${n}</button>`).join('')}</div>`;
}

// ---------- Storage adapter (the only place that touches storage) ----------
// Beta testers and the official app keep SEPARATE data, even on the same phone.
const APP_VERSION = '1.5.0';
const CHANNEL = /(^|[\/.])(beta|test|staging)([\/.-]|$)/i.test(location.hostname + location.pathname) ? 'beta' : 'prod';
const KEY = CHANNEL === 'beta' ? 'pinpro.beta.v1' : 'pinpro.v1', LANG_KEY = 'pinpro.lang';
let storageProblem = false;
const Store = {
  load() { try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { storageProblem = true; return null; } },
  save(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch (e) { toast(t('t_cant_save')); return false; }
  },
  clear() { try { localStorage.removeItem(KEY); return localStorage.getItem(KEY) === null; } catch (e) { return false; } },
  size() { try { return (localStorage.getItem(KEY) || '').length; } catch (e) { return 0; } },
  getLang() { try { return localStorage.getItem(LANG_KEY); } catch (e) { return null; } },
  setLang(l) { try { localStorage.setItem(LANG_KEY, l); } catch (e) {} }
};
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ---------- Data model ----------
// items:     {id, name, cost, price, stock, low, packSize}
// customers: {id, name, phone, limit}
// ledger:    {id, customerId, type:'utang'|'bayad', amount, note, date, at, itemId?, stockDelta?, cashId?}
// cash:      {id, cat, amount, note, date, at, itemId?, stockDelta?, linkId?}
const CATS = {
  benta: 'in', bayad: 'in', dagdag: 'in',
  paninda: 'out', bills: 'out', upa: 'out', pamasahe: 'out', gastos: 'out', kinuha: 'out'
};
const catLabel = k => CATS[k] ? t('cat_' + k) : k;
const SPEND_CATS = ['bills', 'upa', 'pamasahe', 'gastos']; // counted against monthly budget

function blankData() {
  return { version: 1, store: { name: '', openingCash: 0, capital: 0, budget: 0, lastBackup: '', lastBackupChecked: '', createdAt: today() },
           items: [], customers: [], ledger: [], cash: [], adjustments: [] };
}
function migrate(d) {
  if (!d || typeof d !== 'object') return null;
  const b = blankData();
  const arr = k => Array.isArray(d[k]) ? d[k] : [];
  return { ...b, ...d, store: { ...b.store, ...(d.store || {}) },
           items: arr('items'), customers: arr('customers'), ledger: arr('ledger'), cash: arr('cash'), adjustments: arr('adjustments') };
}

function validateData(data) {
  if (!data || typeof data !== 'object' || Array.isArray(data) ||
      !data.store || typeof data.store !== 'object' || Array.isArray(data.store) ||
      typeof data.store.name !== 'string') throw Error('invalid store');
  if (data.version && data.version > 1) throw Error('unsupported backup version');
  const allowedId = s => typeof s === 'string' && /^[A-Za-z0-9_-]{1,96}$/.test(s);
  for (const type of ['items', 'customers', 'ledger', 'cash']) {
    const entries = data[type];
    if (!Array.isArray(entries) || entries.length > 150000) throw Error('invalid records');
    const ids = new Set();
    for (const r of entries) {
      if (!r || typeof r !== 'object' || Array.isArray(r) ||
          !allowedId(r.id) || ids.has(r.id)) throw Error('invalid record ID');
      ids.add(r.id);
    }
  }
  const goodAmount = x => typeof x === 'number' && Number.isFinite(x);
  const goodDate = x => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x);
  for (const it of data.items) if (typeof it.name !== 'string' ||
       !goodAmount(it.cost) || it.cost < 0 || !goodAmount(it.price) ||
       it.price < 0 || !goodAmount(it.stock)) throw Error('bad item');
  for (const cu of data.customers) if (typeof cu.name !== 'string') throw Error('bad customer');
  const custIds = new Set(data.customers.map(x => x.id));
  for (const e of data.ledger) if (!custIds.has(e.customerId) ||
       !['utang','bayad'].includes(e.type) || !goodAmount(e.amount) ||
       e.amount <= 0 || !goodDate(e.date)) throw Error('bad ledger');
  for (const e of data.cash) if (!Object.prototype.hasOwnProperty.call(CATS,e.cat) ||
       !goodAmount(e.amount) || e.amount < 0 || !goodDate(e.date)) throw Error('bad cash');
  if (data.adjustments !== undefined &&
      (!Array.isArray(data.adjustments) || data.adjustments.length > 150000)) throw Error('bad adjustments');
  return true;
}

let D = null; // loaded at startup (bottom of file), after all helpers exist
const state = { tab: 'home', cust: null, q: '', invFilter: 'all', period: 'month', archivedItems: false, archivedCustomers: false, fileMode: 'restore', settingsPage: 'settings' };
let lastRaw = null, lastSnapshot = null;

// ---------- Helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function today() { return ymd(new Date()); }
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
function fmtDate(s) { return new Date(s + 'T00:00:00').toLocaleDateString('en-PH', { month: 'short', day: 'numeric' }); }
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
function peso(n) { n = r2(n); const a = Math.abs(n), d = Number.isInteger(a) ? 0 : 2; return (n < 0 ? '−' : '') + '₱' + a.toLocaleString('en-PH', { minimumFractionDigits: d, maximumFractionDigits: d }); }
const fmtQty = n => String(r2(n));
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const getItem = id => D.items.find(i => i.id === id);
const getCust = id => D.customers.find(c => c.id === id);
const byNewest = (a, b) => b.date.localeCompare(a.date) || (b.at || 0) - (a.at || 0);


/* Native equivalents of React error boundaries and a shared loading state.
   Errors are handled locally; no customer information is sent to an error service. */
let uiBusy = 0;
let runtimeErrorVisible = false;
function setBusy(visible, key) {
  const overlay = $('#busy');
  if (!overlay) return;
  uiBusy = visible ? uiBusy + 1 : Math.max(0, uiBusy - 1);
  overlay.hidden = uiBusy === 0;
  if (uiBusy) {
    $('#busy-text').textContent = t(key || 'ui_loading');
  }
  const app = $('#app');
  if (app && typeof app.setAttribute === 'function') app.setAttribute('aria-busy', String(uiBusy > 0));
}
async function withBusy(key, work) {
  if (uiBusy) return;
  setBusy(true, key);
  try {
    // Invoke work synchronously so browser share/save pickers retain user activation.
    return await work();
  } finally {
    setBusy(false);
  }
}
function setPageTitle(label) {
  const title = label || (!D ? t('ui_setup_title') : state.cust ? t('ui_customer_title') :
    t(({home:'tab_home',paninda:'tab_stock',listahan:'tab_utang',pera:'tab_money'})[state.tab] || 'tab_home'));
  document.title = title + ' · Pin.Pro' + (CHANNEL === 'beta' ? ' Beta' : '');
}
function reportUnexpected(err) {
  // A handler can have changed the working object before throwing; discard unsaved mutations.
  if (lastSnapshot && D) {
    try { D = JSON.parse(lastSnapshot); } catch (_) { /* keep stored data untouched */ }
  }
  if (typeof console !== 'undefined' && console.error) console.error('Pin.Pro unexpected error', err);
  uiBusy = 0;
  const busy = $('#busy'); if (busy) busy.hidden = true;
  const app = $('#app'); if (app && app.setAttribute) app.setAttribute('aria-busy','false');
  const pane = $('#app-error');
  if (!pane) return;
  pane.innerHTML = '<div class="app-error-card"><span class="app-error-icon" aria-hidden="true">⚠️</span>' +
    '<h2 id="app-error-title">' + esc(t('ui_error_title')) + '</h2><p>' + esc(t('ui_error_body')) + '</p>' +
    '<button type="button" class="btn primary" data-ui="retry">' + esc(t('ui_try_again')) + '</button>' +
    (D ? '<button type="button" class="btn ghost" data-ui="backup">' + esc(t('ui_backup')) + '</button>' : '') +
    '<button type="button" class="btn ghost" data-ui="dismiss">' + esc(t('ui_dismiss')) + '</button></div>';
  pane.hidden = false;

  const retry = pane.querySelector('[data-ui="retry"]');
  if (retry && retry.focus) retry.focus();
}
function runSafely(action) {
  try {
    const result = action();
    if (result && typeof result.then === 'function') result.catch(reportUnexpected);
  } catch(err) { reportUnexpected(err); }
}
function dismissUnexpected() {
  const pane = $('#app-error');

  runtimeErrorVisible = false;
}

let toastT;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }
function ask(msg) {
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'ask';
    el.innerHTML = `<div class="ask-card" role="alertdialog" aria-modal="true"><p>${esc(msg).replace(/\n/g, '<br>')}</p>

    el.addEventListener('click', e => {
      const b = e.target.closest('[data-r]'); if (!b && e.target !== el) return;
      e.stopPropagation(); el.remove(); res(!!b && b.dataset.r === '1');
    });
    document.body.appendChild(el); el.querySelector('[data-r="1"]').focus();
  });
}
function commit() {
  try {
    if (localStorage.getItem(KEY) !== lastRaw) {
      D = lastSnapshot ? JSON.parse(lastSnapshot) : null;
      render(); toast(t('storage_conflict')); return false;
    }
  } catch (_) {
    D = lastSnapshot ? JSON.parse(lastSnapshot) : null;
    render(); toast(t('storage_fail')); return false;
  }
  if (!Store.save(D)) {
    D = lastSnapshot ? JSON.parse(lastSnapshot) : null;
    render(); toast(t('storage_fail')); return false;
  }
  lastRaw = localStorage.getItem(KEY);
  lastSnapshot = JSON.stringify(D);
  closeSheet(); render();
  return true;
}
// ---------- Derived numbers (always computed) ----------
function balanceOf(cid) { return r2(D.ledger.filter(e => e.customerId === cid).reduce((s, e) => s + (e.type === 'utang' ? e.amount : -e.amount), 0)); }
function owingSince(cid) {
  const es = D.ledger.filter(e => e.customerId === cid);
  const pays = es.filter(e => e.type === 'bayad').map(e => e.date).sort();
  if (pays.length) return { date: pays[pays.length - 1], key: 'days_pay' };
  const ut = es.filter(e => e.type === 'utang').map(e => e.date).sort();
  return ut.length ? { date: ut[0], key: 'days_first' } : null;
}
const dirOf = c => CATS[c.cat];
function cashOnHand() { return r2(D.store.openingCash + D.cash.reduce((s, c) => s + (dirOf(c) === 'in' ? c.amount : dirOf(c) === 'out' ? -c.amount : 0), 0)); }
function stockValue() { return r2(D.items.reduce((s, i) => s + Math.max(0, i.stock) * i.cost, 0)); }
function utangOut() { return r2(D.customers.reduce((s, c) => s + Math.max(0, balanceOf(c.id)), 0)); }
function totalNow() { return r2(cashOnHand() + stockValue() + utangOut()); }
function sumCash(from, to, dir) { return r2(D.cash.filter(c => c.date >= from && c.date <= to && dirOf(c) === dir).reduce((s, c) => s + c.amount, 0)); }
const isLow = i => !i.archived && i.low > 0 && i.stock <= i.low;
function suggestQty(i) { const pack = i.packSize || 1; const need = Math.max(i.low * 2 - i.stock, 1); return Math.ceil(need / pack) * pack; }
function sinceLine(cid) {
  const s = owingSince(cid); if (!s) return '';
  const d = daysBetween(s.date, today());
  return `<span class="${d >= 30 ? 'badtxt' : d >= 14 ? 'warntxt' : ''}">${t(s.key, { n: d })}</span>`;
}

// ----- Money -----
function periodRange() {
  const td = today();
  if (state.period === 'today') return [td, td, t('lbl_today')];
  if (state.period === 'week') return [addDays(td, -6), td, t('lbl_week')];
  return [td.slice(0, 8) + '01', td, t('lbl_month')];
}
function viewPera() {
  const [from, to, label] = periodRange();
  const list = D.cash.filter(c => c.date >= from && c.date <= to).sort(byNewest);
  let tin = 0, tout = 0; const byCat = {};
  list.forEach(c => { if (dirOf(c) === 'in') tin += c.amount; else if (dirOf(c) === 'out') tout += c.amount; byCat[c.cat] = r2((byCat[c.cat] || 0) + c.amount); });
  tin = r2(tin); tout = r2(tout);
  const cats = Object.keys(byCat).filter(k => CATS[k]).sort((a, b) => byCat[b] - byCat[a]);
  const maxV = Math.max(1, ...cats.map(k => byCat[k]));

  let budgetCard = '';
  const B = D.store.budget;
  if (B && state.period === 'month') {
    const spend = r2(SPEND_CATS.reduce((s, k) => s + (byCat[k] || 0), 0));
    const now = new Date(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const pace = B * now.getDate() / dim, over = spend > B, ahead = !over && spend > pace;
    budgetCard = `<section class="card"><div class="row-between"><h3>${t('budget_title')}</h3><b>${peso(spend)} / ${peso(B)}</b></div>
      <div class="track"><div class="fill ${over ? 'over' : 'out'}" style="width:${Math.min(100, spend / B * 100)}%"></div></div>
      <p class="hint">${over ? t('b_over', { v: peso(spend - B) }) : ahead ? t('b_fast', { v: peso(pace) }) : t('b_ok', { v: peso(B - spend) })}
      <br><span class="small">${t('b_note')}</span></p></section>`;
  }

  return `
  <div class="seg wide">${[['today', 'p_today'], ['week', 'p_week'], ['month', 'p_month']].map(([k, l]) =>
    `<button data-act="period" data-id="${k}" class="${state.period === k ? 'on' : ''}">${t(l)}</button>`).join('')}</div>
  <div class="grid3 totals">
    <section class="card mini"><span class="label">${t('m_in')}</span><b class="goodtxt">${peso(tin)}</b></section>
    <section class="card mini"><span class="label">${t('m_out')}</span><b>${peso(tout)}</b></section>

let lastTransactionStamp = 0;

// ---------- Form handlers ----------
const FORM = {
setup(fd) {
  if (storageProblem) return toast(t('storage_corrupt'));
  D=blankData(); D.store.name=(fd.name||'').trim(); D.store.openingCash=r2(num(fd.openingCash));
  if(!D.store.name || D.store.openingCash<0) {D=null;return toast(t('invalid_value'));}
  if(commit()) toast(t('t_ready'));
},
async item(fd,id) {
  const name=(fd.name||'').trim(); if(!name) return toast(t('t_need_name'));
  const cost=r2(num(fd.cost)),price=r2(num(fd.price)),low=r2(num(fd.low));
  if(cost<0||price<0||low<0||num(fd.stock)<0)return toast(t('invalid_value'));
  if(price<cost && !(await ask(t('a_price_below'))))return;
  const packSize=Math.max(1,Math.round(num(fd.packSize))||1);
  if(id){const i=getItem(id);if(!i)return;Object.assign(i,{name,cost,price,low,packSize});}
  else D.items.push({id:uid(),name,cost,price,stock:r2(num(fd.stock)),low,packSize});
  if(commit())toast(t('t_saved'));
},
async sold(fd,id) {
  const i=getItem(id),qty=r2(num(fd.qty)),price=r2(num(fd.price));
  if(!i||i.archived)return toast(t('archived_no_entry'));
  if(qty<=0||price<=0)return toast(t('invalid_value'));
  if(qty>i.stock && !(await ask(t('a_qty_over',{n:fmtQty(i.stock)}))))return;
  i.stock=r2(i.stock-qty);
  D.cash.push({id:uid(),cat:'benta',amount:r2(qty*price),note:`${i.name} ×${fmtQty(qty)}`,
    date:today(),at:transactionStamp(),itemId:i.id,stockDelta:-qty});
  if(commit())toast(t('t_plus_cash',{v:peso(qty*price)}));
},
async restock(fd,id) {
  const i=getItem(id),packs=r2(num(fd.packs)),pcs=Math.round(num(fd.pcs)),packCost=r2(num(fd.packCost));
  if(!i||i.archived)return toast(t('archived_no_entry'));
  if(packs<=0||pcs<1||packCost<=0)return toast(t('invalid_value'));
  const qty=r2(packs*pcs),spent=r2(packs*packCost);
  let own=fd.fromOwn==='on';
  if(!own && spent>cashOnHand()){if(!(await ask(t('funding_confirm'))))return;own=true;}
  const oldCost=i.cost,oldPack=i.packSize,oldStock=i.stock;
  i.stock=r2(i.stock+qty);i.packSize=pcs;
  i.cost=r2((Math.max(0,oldStock)*oldCost+spent)/(Math.max(0,oldStock)+qty));
  const out={id:uid(),cat:'paninda',amount:spent,note:`${i.name} +${fmtQty(qty)}`,
    date:today(),at:transactionStamp(),itemId:id,stockDelta:qty,priorCost:oldCost,priorPackSize:oldPack};
  if(own)recordPaymentFromOwner(spent,out,out.date,i.name);
  D.cash.push(out);
  if(commit())toast(t('done_restock',{n:fmtQty(qty)+' '+i.name,v:peso(spent)}));
},
count(fd,id) {
  const i=getItem(id),n=r2(num(fd.count));
  if(!i||n<0)return toast(t('invalid_value'));
  const before=i.stock;
  i.stock=n;
  D.adjustments.push({id:uid(),itemId:id,from:before,to:n,date:today(),at:transactionStamp()});
  if(commit())toast(t('correct_count',{n:fmtQty(n)}));
},
cust(fd,id) {
  const name=(fd.name||'').trim();if(!name)return toast(t('t_need_name'));
  const email=(fd.email||'').trim();
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast(t('t_bad_email'));
  const data={name,phone:(fd.phone||'').trim(),email,limit:r2(num(fd.limit))};
  if(id){const c=getCust(id);if(!c)return;Object.assign(c,data);}
  else{const c={id:uid(),...data};D.customers.push(c);state.tab='listahan';state.cust=c.id;}
  if(commit())toast(t('t_saved'));
},
async utang(fd) {
  const amount=r2(num(fd.amount));
  if(amount<=0)return toast(t('t_need_amount'));
  const newName=(fd.newName||'').trim();
  if(!fd.cid&&!newName)return toast(t('t_need_cust'));
  let selected=null,q=0;
  if(fd.itemId){
    selected=getItem(fd.itemId);q=r2(num(fd.qty));
    if(!selected||selected.archived||q<=0)return toast(t('invalid_value'));
    if(q>selected.stock&&!(await ask(t('a_qty_over',{n:fmtQty(selected.stock)}))))return;
  }
  let customer=fd.cid?getCust(fd.cid):null;
  if(fd.cid&&(!customer||customer.archived))return toast(t('archived_no_entry'));
  if(customer){
    const bal=balanceOf(customer.id);
    if(customer.limit&&bal+amount>customer.limit&&
      !(await ask(t('a_over_limit',{c:customer.name,l:peso(customer.limit),b:peso(bal+amount)}))))return;
  } else {
    customer={id:uid(),name:newName,phone:'',email:'',limit:0};
    D.customers.push(customer);
  }
  const e={id:uid(),customerId:customer.id,type:'utang',amount,
    note:(fd.note||'').trim(),date:today(),at:transactionStamp()};
  if(selected){
    selected.stock=r2(selected.stock-q);e.itemId=selected.id;e.stockDelta=-q;
    if(!e.note)e.note=`${selected.name} ×${fmtQty(q)}`;
  }
  D.ledger.push(e);
  if(commit())toast(t('t_recorded',{c:customer.name,v:peso(amount)}));
},
async bayad(fd) {
  if(!fd.cid)return toast(t('t_pick_cust'));
  const customer=getCust(fd.cid),amount=r2(num(fd.amount));
  if(!customer||customer.archived)return toast(t('archived_no_entry'));
  if(amount<=0)return toast(t('t_need_amount'));
  const bal=balanceOf(customer.id);
  if(amount>bal)return toast(t('payment_exceeds',{v:peso(bal)}));
  const e={id:uid(),customerId:customer.id,type:'bayad',amount,
    note:(fd.note||'').trim(),date:today(),at:transactionStamp()};
  const entry={id:uid(),cat:'bayad',amount,note:t('note_pay',{c:customer.name}),
    date:e.date,at:e.at,linkId:e.id};
  e.cashId=entry.id;D.cash.push(entry);D.ledger.push(e);
  if(commit())toast(bal-amount<=0?t('t_paid_full',{c:customer.name}):t('t_received',{v:peso(bal-amount)}));
},
async cash(fd) {
  const amount=r2(num(fd.amount));
  if(amount<=0||!Object.prototype.hasOwnProperty.call(CATS,fd.cat))return toast(t('invalid_value'));
  let own=fd.fromOwn==='on'&&CATS[fd.cat]==='out';
  if(CATS[fd.cat]==='out'&&!own&&amount>cashOnHand()){
    if(!(await ask(t('funding_confirm'))))return;
    own=true;
  }
  const entry={id:uid(),cat:fd.cat,amount,note:(fd.note||'').trim(),
    date:fd.date||today(),at:transactionStamp()};
  if(own)recordPaymentFromOwner(amount,entry,entry.date,catLabel(entry.cat));
  D.cash.push(entry);
  if(commit())toast(t('money_saved'));
},
settings(fd) {
  Object.assign(D.store,{name:(fd.name||'').trim()||D.store.name,
    openingCash:r2(num(fd.openingCash)),capital:r2(num(fd.capital)),budget:r2(num(fd.budget))});
  if(commit())toast(t('t_saved'));
},
};


// ---------- Deletes (preserve customer/item histories, reverse linked funding) ----------
function revertStock(rec) {
  if(rec.itemId&&rec.stockDelta){const i=getItem(rec.itemId);if(i)i.stock=r2(i.stock-rec.stockDelta);}
}

async function delEntry(id) {
  const e=D.ledger.find(x=>x.id===id);if(!e)return;
  const msg=t('a_del_entry',{type:t('type_'+e.type),v:peso(e.amount),d:fmtDate(e.date)})+(e.cashId?t('a_also_cash'):'');
  if(!(await ask(msg)))return;
  revertStock(e);
  if(e.cashId)D.cash=D.cash.filter(x=>x.id!==e.cashId);
  D.ledger=D.ledger.filter(x=>x.id!==id);
  commit();
}

async function delCash(id) {
  const selected=D.cash.find(x=>x.id===id);if(!selected)return;
  const c=selected.fundingFor?D.cash.find(x=>x.id===selected.fundingFor):selected;
  if(!c)return toast(t('backup_invalid'));
  const linked=c.linkId&&D.ledger.find(e=>e.id===c.linkId);
  const funding=c.fundedBy?D.cash.find(x=>x.id===c.fundedBy):null;
  if(c.cat==='paninda'&&c.itemId&&c.stockDelta>0){
    const later=D.cash.some(x=>x.id!==c.id&&x.itemId===c.itemId&&x.at>c.at) ||
      D.ledger.some(x=>x.itemId===c.itemId&&x.at>c.at) ||
      D.adjustments.some(x=>x.itemId===c.itemId&&x.at>c.at);
    if(later)return toast(t('restock_later'));
    const item=getItem(c.itemId);
    if(!item)return toast(t('restock_changed'));
    if(!(await ask(t('restock_undo'))))return;
    revertStock(c);
    if(typeof c.priorCost==='number')item.cost=c.priorCost;
    if(typeof c.priorPackSize==='number')item.packSize=c.priorPackSize;
  } else {
    const msg=t('a_del_cash',{c:catLabel(c.cat),v:peso(c.amount)})+
      (linked?t('a_also_ledger'):'')+(c.stockDelta?t('a_also_stock'):'');
    if(!(await ask(msg)))return;
    revertStock(c);
  }
  if(linked)D.ledger=D.ledger.filter(x=>x.id!==linked.id);
  D.cash=D.cash.filter(x=>x.id!==c.id&&(!funding||x.id!==funding.id));
  commit();
}

async function delCust(id) {
  const c=getCust(id);if(!c)return;
  if(balanceOf(id)>0)return toast(t('archive_owing'));
  const hasHistory=D.ledger.some(e=>e.customerId===id);
  if(!(await ask(hasHistory?t('archive_customer',{n:c.name}):t('a_del_cust',{c:c.name}))))return;
  if(hasHistory)c.archived=true;else D.customers=D.customers.filter(x=>x.id!==id);
  state.cust=null;
  if(commit())toast(hasHistory?t('archive_success'):t('t_saved'));
}

async function delItem(id) {
  const i=getItem(id);if(!i)return;
  const history=D.ledger.some(x=>x.itemId===id)||D.cash.some(x=>x.itemId===id)||
    D.adjustments.some(x=>x.itemId===id);
  if(history&&i.stock!==0)return toast(t('archive_stock'));
  if(!(await ask(history?t('archive_item',{n:i.name}):t('a_del_item'))))return;
  if(history){i.archived=true;i.savedLow=i.low;i.low=0;}
  else D.items=D.items.filter(x=>x.id!==id);
  if(commit())toast(history?t('archive_success'):t('t_saved'));
}

function unarchiveItem(id) {
  const i=getItem(id);if(!i)return;
  i.archived=false;
  if(typeof i.savedLow==='number'){i.low=i.savedLow;delete i.savedLow;}
  if(commit())toast(t('t_saved'));
}

function unarchiveCust(id) {
  const c=getCust(id);if(!c)return;
  c.archived=false;
  if(commit())toast(t('t_saved'));
}
// ---------- Sharing, backup, restore ----------
async function shareText(text) {
  return withBusy('ui_share_progress', async () => {
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); toast(t('t_copied')); }
    catch (e) { openSheet(`<h2>${t('copy')}</h2><textarea class="copy" readonly>${esc(text)}</textarea>`); }
  });
}
function custMsg(id) {
  const c = getCust(id), bal = balanceOf(id);
  const recent = D.ledger.filter(e => e.customerId === id).sort(byNewest).slice(0, 5).reverse();
  const lines = recent.map(e => `${fmtDate(e.date)}  ${e.type === 'utang' ? t('e_utang').replace('📝 ', '') : t('e_bayad').replace('✅ ', '')} ${peso(e.amount)}${e.note ? ' – ' + e.note : ''}`).join('\n');
  return t('share_cust', { c: c.name, s: D.store.name, v: peso(Math.max(0, bal)), d: fmtDate(today()), lines });
}
function shareCust(id) { shareText(custMsg(id)); }
function emailLink(id) {
  const c = getCust(id);
  return `mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(t('email_subj', { s: D.store.name }))}&body=${encodeURIComponent(custMsg(id))}`;
}
function shareRestock() {
  const need = D.items.filter(isLow).map(i => ({ i, q: suggestQty(i) }));
  const est = r2(need.reduce((s, n) => s + n.q * n.i.cost, 0));
  const lines = need.map(({ i, q }) => `• ${i.name} — ${fmtQty(q)} ${t('pcs')}${(i.packSize || 1) > 1 ? ` (${fmtQty(q / i.packSize)} pack)` : ''}`).join('\n');
  shareText(t('share_restock', { s: D.store.name, d: fmtDate(today()), lines, v: peso(est) }));
}
function backupFile() {
  const name=`pinpro-beta-${today()}.json`;
  return {name,file:new File([JSON.stringify(D,null,2)],name,{type:'application/json'})};
}

async function doBackup() {
  if(!D)return;
  return withBusy('ui_save_progress', async () => {
    const {name,file}=backupFile();
    try {
      if(typeof window.showSaveFilePicker==='function'){
        // This must run in the same user-activation turn as the button click.
        const handle=await window.showSaveFilePicker({
          suggestedName:name,types:[{description:'Pin.Pro JSON backup',accept:{'application/json':['.json']}}]});
        const writable=await handle.createWritable();
        await writable.write(file);
        await writable.close();
      } else {
        const url=URL.createObjectURL(file);
        const a=document.createElement('a');a.href=url;a.download=name;
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),30000);
      }
      D.store.lastBackup=today();
      if(commit())toast(t('backup_started'));
    } catch(err) {
      if(err.name!=='AbortError')toast(t('t_cant_save'));
    }
  });
}

async function shareBackup() {
  if(!D)return;
  return withBusy('ui_share_progress', async () => {
    try {
      const {name,file}=backupFile();
      if(!navigator.canShare||!navigator.canShare({files:[file]}))return toast(t('backup_save'));
      await navigator.share({files:[file],title:name});
      D.store.lastBackup=today();
      if(commit())toast(t('backup_started'));
    } catch(err) {if(err.name!=='AbortError')toast(t('t_cant_save'));}
  });
}
function selectBackup(mode) {
  state.fileMode=mode;
  $('#file').click();
}

function comparableBackup(data) {
  const {lastBackup,lastBackupChecked,...store}=data.store||{};
  return JSON.stringify({store,items:data.items,customers:data.customers,
    ledger:data.ledger,cash:data.cash,adjustments:data.adjustments||[]});
}

async function handleBackupFile(e) {
  const f=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!f)return;
  return withBusy(state.fileMode==='verify' ? 'ui_verify_progress' : 'ui_restore_progress', async () => {
    try {
      if(f.size>10*1024*1024)throw Error('too large');
      const candidate=JSON.parse(await f.text());
      validateData(candidate);
      if(state.fileMode==='verify'){
        if(!D||comparableBackup(candidate)!==comparableBackup(D)){
          toast(t('backup_mismatch'));return;
        }
        D.store.lastBackupChecked=today();
        if(commit())toast(t('backup_ok'));
        return;
      }
      if(D&&!(await ask(t('a_restore'))))return;
      D=migrate(candidate);
      if(commit()) {
        storageProblem=false;
        state.tab='home';state.cust=null;
        render();toast(t('t_restored'));
      }
    } catch(err){toast(t('backup_invalid'));}
  });
}
// One authoritative import handler, shared by restore and optional verification.
$('#file').addEventListener('change', handleBackupFile);

// ---------- Actions (all taps go through here) ----------
const ACT = {
  tab: id => { state.tab=id;state.cust=null;state.q='';render();scrollTo(0,0); },
  lang: id => {
    if(!Object.prototype.hasOwnProperty.call(LI,id))return;
    lang=id;Store.setLang(id);
    const open=!!$('#sheet .sheet-card');
    render();
    if(open && D){
      if(state.settingsPage==='storage')sheetStorage();
      else if(state.settingsPage==='rules')sheetRules();
      else if(state.settingsPage==='install')sheetInstall();
      else sheetSettings();
    }
  },
  close: closeSheet,
  settings: sheetSettings,
  storage: sheetStorage,
  rules: sheetRules,
  installHelp: sheetInstall,
  installNow,
  item: sheetItem,
  addItem: () => sheetItemForm(),
  editItem: id => sheetItemForm(id),
  sold: sheetSold,
  restock: sheetRestock,
  count: sheetCount,
  delItem,
  unarchiveItem,
  archiveItems: () => {state.archivedItems=!state.archivedItems;render();},
  archiveCustomers: () => {state.archivedCustomers=!state.archivedCustomers;render();},
  invFilter: id => {state.invFilter=id;render();},
  shareRestock,
  cust: id => {state.cust=id;render();scrollTo(0,0);},
  openCust: id => {state.tab='listahan';state.cust=id;state.q='';render();scrollTo(0,0);},
  back: () => {state.cust=null;render();},
  addCust: () => sheetCustForm(),
  editCust: id => sheetCustForm(id),
  delCust,
  unarchiveCust,
  newUtang: id => sheetUtang(id),
  newBayad: id => sheetBayad(id),
  shareCust,delEntry,
  fillFull: (id,el) => {el.closest('form').amount.value=el.dataset.v;},
  newIn: () => sheetCash('in','benta'),
  newOut: () => sheetCash('out','gastos'),
  period: id => {state.period=id;render();},
  delCash,
  setCapital: () => {D.store.capital=totalNow();if(commit())toast(t('t_cap_set'));},
  backup: doBackup,
  shareBackup,
  restore: () => selectBackup('restore'),
  verify: () => selectBackup('verify'),
  sample: () => {
    if(storageProblem)return toast(t('storage_corrupt'));
    D=sampleData();D.store.capital=Math.floor(totalNow()/1000)*1000;
    if(commit())toast(t('t_sample'));
  },
  wipe: async () => {
    if(!(await ask(t('a_wipe1'))))return;
    if(!(await ask(t('a_wipe2'))))return;
    if(!Store.clear())return toast(t('storage_fail'));
    D=null;lastRaw=null;lastSnapshot=null;storageProblem=false;
    Object.assign(state,{tab:'home',cust:null,q:'',archivedItems:false,archivedCustomers:false});
    closeSheet();render();
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); if (uiBusy || runtimeErrorVisible) return;
    runSafely(() => fn(el.dataset.id, el)); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-ui]'); if (!el) return;
  e.preventDefault();
  const op = el.dataset.ui;
  if (op === 'dismiss') dismissUnexpected();
  else if (op === 'retry') {
    dismissUnexpected();
    runSafely(() => render());
  } else if (op === 'backup') {
    dismissUnexpected();
    runSafely(() => doBackup());
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (uiBusy || runtimeErrorVisible) return;
  const f = e.target, fn = FORM[f.dataset.form];
  if (fn) runSafely(() => fn(Object.fromEntries(new FormData(f)), f.dataset.id || null));
});
function onEdit(e) {
  const el = e.target;
  if (el.id === 'q') { state.q = el.value; $('#list').innerHTML = state.tab === 'paninda' ? itemRows() : custRows(); return; }
  if (el.hasAttribute('data-preview')) { const f = el.closest('form'); PREVIEW[f.dataset.form] && PREVIEW[f.dataset.form](f); }
}
document.addEventListener('input', e => runSafely(() => onEdit(e)));

document.addEventListener('change', e => runSafely(() => { if(e.target.id==='ruleTopic')showRule(); else if(e.target.tagName==='SELECT')onEdit(e); }));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (runtimeErrorVisible) dismissUnexpected();
    else if (!uiBusy) runSafely(() => closeSheet());
    return;
  }
  if (!D || uiBusy || runtimeErrorVisible || $('#sheet').classList.contains('show')) return;
  const target = e.target || {};
  const name = String(target.tagName || '').toLowerCase();
  if (target.isContentEditable || ['input','textarea','select'].includes(name) ||
      e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (e.key === '/' && (state.tab === 'paninda' || (state.tab === 'listahan' && !state.cust))) {
    const search = $('#q');
    if (search && search.focus) {e.preventDefault();search.focus();}
    return;
  }
  const action = ({ F2:'newIn',F3:'newUtang',F4:'newBayad' })[e.key];
  if (action && ACT[action]) {e.preventDefault();runSafely(() => ACT[action]());}
});
window.addEventListener('error', e => {
  reportUnexpected(e.error || new Error(e.message || 'Unexpected browser error'));
  if (e.preventDefault) e.preventDefault();
});
window.addEventListener('unhandledrejection', e => {
  reportUnexpected(e.reason || new Error('Unexpected asynchronous error'));
  if (e.preventDefault) e.preventDefault();
});

// ---------- Start ----------
lang = (s => LI.hasOwnProperty(s) ? s : guessLang())(Store.getLang());
const saved=Store.load();
try { if(saved)validateData(saved);D=migrate(saved); }
catch(_) {storageProblem=true;D=null;}
try {lastRaw=localStorage.getItem(KEY);}catch(_) {storageProblem=true;}
lastSnapshot=D?JSON.stringify(D):null;
try { render(); } catch (err) { reportUnexpected(err); }
// Offline support: only when served from a real website (GitHub Pages, etc.)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
